[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inventario-vm"
version = "0.1.0"
description = "Inventário e drift de VM por SSH contra o baseline do parque"
requires-python = ">=3.11"
dependencies = [
    "paramiko>=4,<6",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
teste = ["pytest>=8"]

[project.scripts]
inventario-vm = "inventario_vm.cli:main"

[tool.setuptools]
packages = ["inventario_vm"]

[tool.setuptools.package-data]
inventario_vm = ["baseline.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
