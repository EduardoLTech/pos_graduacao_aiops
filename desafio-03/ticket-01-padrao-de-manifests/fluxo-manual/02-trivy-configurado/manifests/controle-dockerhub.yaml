apiVersion: apps/v1
kind: Deployment
metadata:
  name: controle-dockerhub
  namespace: nyx-prod
  labels:
    app: nyxapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nyxapi
  template:
    metadata:
      labels:
        app: nyxapi
    spec:
      containers:
        - name: api
          image: fabricioveronez/kube-news:v1
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: "postgres://nyx:s3nh4-do-banco@pg.nyx-prod.svc:5432/nyx"
---
