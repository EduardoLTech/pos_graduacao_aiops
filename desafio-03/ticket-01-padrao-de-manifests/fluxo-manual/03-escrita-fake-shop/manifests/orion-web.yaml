apiVersion: v1
kind: ServiceAccount
metadata:
  name: orion-web
  namespace: orion-prod
  labels:
    app.kubernetes.io/name: orion-web
    app.kubernetes.io/instance: orion-prod
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orion-web
  namespace: orion-prod
  labels:
    app.kubernetes.io/name: orion-web
    app.kubernetes.io/instance: orion-prod
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
data:
  DB_HOST: orion-postgres
  DB_PORT: "5432"
  DB_NAME: ecommerce
  DB_USER: ecommerce
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-web
  namespace: orion-prod
  labels:
    app.kubernetes.io/name: orion-web
    app.kubernetes.io/instance: orion-prod
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: sre
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orion-web
      app.kubernetes.io/instance: orion-prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orion-web
        app.kubernetes.io/instance: orion-prod
        app.kubernetes.io/part-of: orion
        app.kubernetes.io/managed-by: platform
    spec:
      serviceAccountName: orion-web
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: registry.metacortex.io/orion/fake-shop:v1@sha256:07db4334f5f2bb330f0f342a81ad203bb21b770b8d7a27c90edb2261fea34e2f
          # Sem o entrypoint.sh: a migracao sai para o Job orion-web-migracao,
          # senao cada replica roda "flask db upgrade" ao mesmo tempo.
          command: ["python", "-m", "gunicorn", "--bind", "0.0.0.0:5000", "index:app"]
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: orion-web
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: orion-db, key: password}
          readinessProbe:
            # /shop consulta a tabela de produtos: so fica pronto com banco
            # acessivel e schema migrado.
            httpGet: {path: /shop, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            # /metrics nao toca no banco: banco lento nao reinicia o container.
            httpGet: {path: /metrics, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: metrics, mountPath: /tmp/metrics}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: metrics
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: orion-web
  namespace: orion-prod
  labels:
    app.kubernetes.io/name: orion-web
    app.kubernetes.io/instance: orion-prod
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: orion-web
    app.kubernetes.io/instance: orion-prod
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orion-web
  namespace: orion-prod
  labels:
    app.kubernetes.io/name: orion-web
    app.kubernetes.io/instance: orion-prod
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orion-web
      app.kubernetes.io/instance: orion-prod
