metadata:
  labels:
    app.kubernetes.io/instance: orion-stg
    app.kubernetes.io/managed-by: platform
    app.kubernetes.io/name: fake-shop-migracao
    app.kubernetes.io/part-of: orion
  name: fake-shop-migracao-v1
  namespace: orion-stg
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: orion-stg
        app.kubernetes.io/managed-by: platform
        app.kubernetes.io/name: fake-shop-migracao
        app.kubernetes.io/part-of: orion
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - python
        - -m
        - flask
        - db
        - upgrade
        env:
        - name: FLASK_APP
          value: index.py
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              key: user
              name: orion-fake-shop-db
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: orion-fake-shop-db
        envFrom:
        - configMapRef:
            name: fake-shop
        image: docker.io/fabricioveronez/fake-shop:v1@sha256:07db4334f5f2bb330f0f342a81ad203bb21b770b8d7a27c90edb2261fea34e2f
        name: migracao
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        - mountPath: /tmp/metrics
          name: metrics
      restartPolicy: Never
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: fake-shop-migracao
      volumes:
      - emptyDir: {}
        name: tmp
      - emptyDir: {}
        name: metrics
