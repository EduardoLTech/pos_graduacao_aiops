# Migração de schema do fake-shop (flask db upgrade), fora do container da aplicação
# para as duas réplicas não migrarem ao mesmo tempo. O nome leva a versão da imagem:
# Job é imutável, cada release ganha um Job novo.
# O rótulo name é fake-shop-migracao, e não fake-shop, para o pod do Job não cair
# no seletor do Service nem no do PDB.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fake-shop-migracao
  namespace: orion-prod
  labels:
    app.kubernetes.io/name: fake-shop-migracao
    app.kubernetes.io/instance: orion-prod
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: sre
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: fake-shop-migracao-v1
  namespace: orion-prod
  labels:
    app.kubernetes.io/name: fake-shop-migracao
    app.kubernetes.io/instance: orion-prod
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: sre
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fake-shop-migracao
        app.kubernetes.io/instance: orion-prod
        app.kubernetes.io/part-of: orion
        app.kubernetes.io/managed-by: platform
    spec:
      restartPolicy: Never
      serviceAccountName: fake-shop-migracao
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migracao
          image: registry.metacortex.io/orion/fake-shop:v1@sha256:07db4334f5f2bb330f0f342a81ad203bb21b770b8d7a27c90edb2261fea34e2f
          command: ["python", "-m", "flask", "db", "upgrade"]
          envFrom:
            - configMapRef:
                name: fake-shop      # DB_NAME, DB_PORT e PROMETHEUS_MULTIPROC_DIR (index.py importa o exporter)
          env:
            - name: FLASK_APP
              value: index.py
            - name: DB_HOST
              valueFrom:
                secretKeyRef: {name: orion-fake-shop-db, key: host}
            - name: DB_USER
              valueFrom:
                secretKeyRef: {name: orion-fake-shop-db, key: user}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: orion-fake-shop-db, key: password}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: metrics, mountPath: /tmp/metrics}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: metrics
          emptyDir: {}
