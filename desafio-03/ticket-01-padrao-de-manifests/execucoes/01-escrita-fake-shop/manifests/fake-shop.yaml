# fake-shop (loja web Flask + gunicorn) do cliente orion em produção.
# Decisões e pendências: ../relatorio.md
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fake-shop
  namespace: orion-prod
  labels:
    app.kubernetes.io/name: fake-shop
    app.kubernetes.io/instance: orion-prod
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: sre
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fake-shop
  namespace: orion-prod
  labels:
    app.kubernetes.io/name: fake-shop
    app.kubernetes.io/instance: orion-prod
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: sre
data:
  DB_NAME: ecommerce
  DB_PORT: "5432"
  PROMETHEUS_MULTIPROC_DIR: /tmp/metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-shop
  namespace: orion-prod
  labels:
    app.kubernetes.io/name: fake-shop
    app.kubernetes.io/instance: orion-prod
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: sre
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fake-shop
      app.kubernetes.io/instance: orion-prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fake-shop
        app.kubernetes.io/instance: orion-prod
        app.kubernetes.io/part-of: orion
        app.kubernetes.io/managed-by: platform
    spec:
      serviceAccountName: fake-shop
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: registry.metacortex.io/orion/fake-shop:v1@sha256:07db4334f5f2bb330f0f342a81ad203bb21b770b8d7a27c90edb2261fea34e2f
          # Só o servidor: a migração do entrypoint.sh roda no Job fake-shop-migracao-v1.
          # gunicorn como PID 1 trata SIGTERM.
          command: ["python", "-m", "gunicorn", "--bind", "0.0.0.0:5000", "index:app"]
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: fake-shop
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef: {name: orion-fake-shop-db, key: host}
            - name: DB_USER
              valueFrom:
                secretKeyRef: {name: orion-fake-shop-db, key: user}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: orion-fake-shop-db, key: password}
          readinessProbe:            # /shop consulta a tabela products: depende do banco e do schema
            httpGet: {path: /shop, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:             # /metrics não toca no banco
            httpGet: {path: /metrics, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:                 # iniciais, sem medição de consumo
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}                  # arquivos de heartbeat dos workers do gunicorn
            - {name: metrics, mountPath: /tmp/metrics}      # PROMETHEUS_MULTIPROC_DIR
      volumes:
        - name: tmp
          emptyDir: {}
        - name: metrics
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fake-shop
  namespace: orion-prod
  labels:
    app.kubernetes.io/name: fake-shop
    app.kubernetes.io/instance: orion-prod
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: sre
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fake-shop
    app.kubernetes.io/instance: orion-prod
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fake-shop
  namespace: orion-prod
  labels:
    app.kubernetes.io/name: fake-shop
    app.kubernetes.io/instance: orion-prod
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: sre
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fake-shop
      app.kubernetes.io/instance: orion-prod
