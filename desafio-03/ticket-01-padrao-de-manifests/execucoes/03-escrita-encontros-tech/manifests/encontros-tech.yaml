# encontros-tech (Flask + gunicorn) do cliente helio em staging.
# Decisões e pendências: ../relatorio.md
# PENDENTE: a tag "pendente-loom" da imagem não existe. Troque pela tag@digest
# que o Loom publicar antes de aplicar (relatório, pendência 1).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: encontros-tech
  namespace: helio-stg
  labels:
    app.kubernetes.io/name: encontros-tech
    app.kubernetes.io/instance: helio-stg
    app.kubernetes.io/part-of: helio
    app.kubernetes.io/managed-by: platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: encontros-tech
  namespace: helio-stg
  labels:
    app.kubernetes.io/name: encontros-tech
    app.kubernetes.io/instance: helio-stg
    app.kubernetes.io/part-of: helio
    app.kubernetes.io/managed-by: platform
data:
  DEBUG: "false"
  LOG_LEVEL: INFO
  LOG_FORMAT: simple
  SERVICE_NAME: encontros-tech
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: encontros-tech
  namespace: helio-stg
  labels:
    app.kubernetes.io/name: encontros-tech
    app.kubernetes.io/instance: helio-stg
    app.kubernetes.io/part-of: helio
    app.kubernetes.io/managed-by: platform
spec:
  replicas: 1                        # stg: create_all roda no import de main.py (ver relatório)
  selector:
    matchLabels:
      app.kubernetes.io/name: encontros-tech
      app.kubernetes.io/instance: helio-stg
  template:
    metadata:
      labels:
        app.kubernetes.io/name: encontros-tech
        app.kubernetes.io/instance: helio-stg
        app.kubernetes.io/part-of: helio
        app.kubernetes.io/managed-by: platform
    spec:
      serviceAccountName: encontros-tech
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: registry.metacortex.io/helio/encontros-tech:pendente-loom
          # gunicorn como PID 1 trata SIGTERM. Um worker: create_all (main.py:21)
          # roda uma vez por pod e as métricas ficam em modo de processo único.
          # Supõe WORKDIR da imagem = src/ (imports "core.*", "models.*").
          command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "1", "main:app"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: encontros-tech
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: helio-encontros-tech-db, key: database-url}
          readinessProbe:            # consulta a tabela events: depende do banco e do schema
            httpGet: {path: "/api/events/?limit=1", port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:             # /metrics (prometheus_flask_exporter) não toca no banco
            httpGet: {path: /metrics, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:                 # iniciais, sem medição de consumo
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}  # heartbeat do gunicorn e os.makedirs de main.py:32
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: encontros-tech
  namespace: helio-stg
  labels:
    app.kubernetes.io/name: encontros-tech
    app.kubernetes.io/instance: helio-stg
    app.kubernetes.io/part-of: helio
    app.kubernetes.io/managed-by: platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: encontros-tech
    app.kubernetes.io/instance: helio-stg
  ports:
    - name: http
      port: 80
      targetPort: http
