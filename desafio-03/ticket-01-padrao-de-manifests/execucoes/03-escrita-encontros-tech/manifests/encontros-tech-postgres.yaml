# PostgreSQL do encontros-tech (helio-stg): réplica única com PVC.
# Serve para staging; em prod uma réplica única fere a 2.3.
# Decisões e pendências: ../relatorio.md
# PENDENTE: a tag "pendente-loom" da imagem não existe. Troque pela tag@digest
# do postgres espelhado pelo Loom antes de aplicar (relatório, pendência 1).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: encontros-tech-postgres
  namespace: helio-stg
  labels:
    app.kubernetes.io/name: encontros-tech-postgres
    app.kubernetes.io/instance: helio-stg
    app.kubernetes.io/part-of: helio
    app.kubernetes.io/managed-by: platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: encontros-tech-postgres
  namespace: helio-stg
  labels:
    app.kubernetes.io/name: encontros-tech-postgres
    app.kubernetes.io/instance: helio-stg
    app.kubernetes.io/part-of: helio
    app.kubernetes.io/managed-by: platform
spec:
  clusterIP: None                    # headless, governa o StatefulSet
  selector:
    app.kubernetes.io/name: encontros-tech-postgres
    app.kubernetes.io/instance: helio-stg
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: encontros-tech-postgres
  namespace: helio-stg
  labels:
    app.kubernetes.io/name: encontros-tech-postgres
    app.kubernetes.io/instance: helio-stg
    app.kubernetes.io/part-of: helio
    app.kubernetes.io/managed-by: platform
spec:
  serviceName: encontros-tech-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: encontros-tech-postgres
      app.kubernetes.io/instance: helio-stg
  template:
    metadata:
      labels:
        app.kubernetes.io/name: encontros-tech-postgres
        app.kubernetes.io/instance: helio-stg
        app.kubernetes.io/part-of: helio
        app.kubernetes.io/managed-by: platform
    spec:
      serviceAccountName: encontros-tech-postgres
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: registry.metacortex.io/helio/postgres:pendente-loom
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA           # subdiretório: a raiz do volume pode ter lost+found
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: encontros_tech
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: helio-encontros-tech-db, key: user}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: helio-encontros-tech-db, key: password}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:                 # iniciais, sem medição de consumo
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}  # socket e lock do servidor
            - {name: tmp, mountPath: /tmp}                 # nss_wrapper do entrypoint (UID sem entrada em /etc/passwd)
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: encontros-tech-postgres
          app.kubernetes.io/instance: helio-stg
          app.kubernetes.io/part-of: helio
          app.kubernetes.io/managed-by: platform
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
