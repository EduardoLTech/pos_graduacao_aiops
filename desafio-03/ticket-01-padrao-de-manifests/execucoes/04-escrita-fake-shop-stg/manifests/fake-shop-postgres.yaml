# PostgreSQL do fake-shop (orion-stg): réplica única com PVC.
# Serve para staging; em prod uma réplica única fere a 2.3.
# Decisões e pendências: ../relatorio.md
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fake-shop-postgres
  namespace: orion-stg
  labels:
    app.kubernetes.io/name: fake-shop-postgres
    app.kubernetes.io/instance: orion-stg
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: fake-shop-postgres
  namespace: orion-stg
  labels:
    app.kubernetes.io/name: fake-shop-postgres
    app.kubernetes.io/instance: orion-stg
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
spec:
  clusterIP: None                    # headless, governa o StatefulSet
  selector:
    app.kubernetes.io/name: fake-shop-postgres
    app.kubernetes.io/instance: orion-stg
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fake-shop-postgres
  namespace: orion-stg
  labels:
    app.kubernetes.io/name: fake-shop-postgres
    app.kubernetes.io/instance: orion-stg
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
spec:
  serviceName: fake-shop-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fake-shop-postgres
      app.kubernetes.io/instance: orion-stg
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fake-shop-postgres
        app.kubernetes.io/instance: orion-stg
        app.kubernetes.io/part-of: orion
        app.kubernetes.io/managed-by: platform
    spec:
      serviceAccountName: fake-shop-postgres
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: registry.metacortex.io/orion/postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA           # subdiretório: a raiz do volume pode ter lost+found
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: ecommerce
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: orion-fake-shop-db, key: user}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: orion-fake-shop-db, key: password}
          lifecycle:
            preStop:                 # o kubelet manda SIGTERM (smart shutdown, espera as conexões do gunicorn); fast desconecta e para
              exec:
                command: ["sh", "-c", "pg_ctl stop -D \"$PGDATA\" -m fast -t 25"]
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:                 # iniciais, sem medição de consumo
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}  # socket e lock do servidor
            - {name: tmp, mountPath: /tmp}                 # nss_wrapper do entrypoint (UID 10001 sem entrada em /etc/passwd)
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: fake-shop-postgres
          app.kubernetes.io/instance: orion-stg
          app.kubernetes.io/part-of: orion
          app.kubernetes.io/managed-by: platform
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
