# Migração de schema do fake-shop (flask db upgrade), fora do container da aplicação.
# O nome leva a versão da imagem: Job é imutável, cada release ganha um Job novo.
# O rótulo name é fake-shop-migracao, e não fake-shop, para o pod do Job não cair
# no seletor do Service.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fake-shop-migracao
  namespace: orion-stg
  labels:
    app.kubernetes.io/name: fake-shop-migracao
    app.kubernetes.io/instance: orion-stg
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: fake-shop-migracao-v1
  namespace: orion-stg
  labels:
    app.kubernetes.io/name: fake-shop-migracao
    app.kubernetes.io/instance: orion-stg
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
spec:
  backoffLimit: 6                    # cobre o tempo do PostgreSQL subir no primeiro apply
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fake-shop-migracao
        app.kubernetes.io/instance: orion-stg
        app.kubernetes.io/part-of: orion
        app.kubernetes.io/managed-by: platform
    spec:
      restartPolicy: Never
      serviceAccountName: fake-shop-migracao
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migracao
          image: registry.metacortex.io/orion/fake-shop:v1@sha256:07db4334f5f2bb330f0f342a81ad203bb21b770b8d7a27c90edb2261fea34e2f
          command: ["python", "-m", "flask", "db", "upgrade"]
          envFrom:
            - configMapRef:
                name: fake-shop      # DB_HOST, DB_PORT, DB_NAME e PROMETHEUS_MULTIPROC_DIR (index.py importa o exporter)
          env:
            - name: FLASK_APP
              value: index.py
            - name: DB_USER
              valueFrom:
                secretKeyRef: {name: orion-fake-shop-db, key: user}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: orion-fake-shop-db, key: password}
          resources:                 # iniciais, sem medição de consumo
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: metrics, mountPath: /tmp/metrics}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: metrics
          emptyDir: {}
